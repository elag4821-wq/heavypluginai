<!DOCTYPE html>
<html>
<head>
    <title>Minecraft Plugin AI Creator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, system-ui; background: #1a1a1a; color: white; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .header { text-align: center; margin-bottom: 30px; padding: 20px; background: #2a2a2a; border-radius: 10px; }
        h1 { color: #4CAF50; }
        .tagline { color: #888; margin-top: 5px; }
        .config-section { background: #2a2a2a; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        select, input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; font-size: 16px; }
        textarea { height: 150px; resize: vertical; font-family: monospace; }
        button { background: #4CAF50; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; width: 100%; cursor: pointer; margin-top: 20px; }
        button:hover { background: #45a049; }
        .output { background: #2a2a2a; padding: 20px; border-radius: 10px; margin-top: 20px; display: none; }
        .code-block { background: #1e1e1e; padding: 15px; border-radius: 8px; overflow-x: auto; margin-top: 10px; }
        .loader { display: none; text-align: center; padding: 20px; }
        .spinner { border: 4px solid #333; border-top: 4px solid #4CAF50; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .feature { background: #333; padding: 10px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧩 Minecraft Plugin AI Creator</h1>
            <p class="tagline">Free plugin generator for all Minecraft versions</p>
        </div>

        <div class="config-section">
            <h3>⚙️ Plugin Configuration</h3>
            <div class="config-grid">
                <div class="feature">
                    <label>Platform</label>
                    <select id="platform">
                        <option value="spigot">Spigot</option>
                        <option value="paper">Paper</option>
                        <option value="purpur">Purpur</option>
                        <option value="velocity">Velocity</option>
                        <option value="bungeecord">BungeeCord</option>
                    </select>
                </div>
                
                <div class="feature">
                    <label>Minecraft Version</label>
                    <select id="version">
                        <option value="1.21.1">1.21.1 (Latest)</option>
                        <option value="1.20.6">1.20.6</option>
                        <option value="1.19.4">1.19.4</option>
                        <option value="1.18.2">1.18.2</option>
                        <option value="1.17.1">1.17.1</option>
                        <option value="1.16.5">1.16.5</option>
                        <option value="1.15.2">1.15.2</option>
                        <option value="1.14.4">1.14.4</option>
                        <option value="1.13.2">1.13.2</option>
                        <option value="1.12.2">1.12.2</option>
                        <option value="1.11.2">1.11.2</option>
                        <option value="1.10.2">1.10.2</option>
                        <option value="1.9.4">1.9.4</option>
                        <option value="1.8.9">1.8.9</option>
                    </select>
                </div>
                
                <div class="feature">
                    <label>Plugin Name</label>
                    <input type="text" id="pluginName" placeholder="MyAwesomePlugin" value="MyPlugin">
                </div>
                
                <div class="feature">
                    <label>Main Class</label>
                    <input type="text" id="mainClass" placeholder="Main" value="Main">
                </div>
            </div>
            
            <div style="margin-top: 20px;">
                <label>📝 Describe Your Plugin</label>
                <textarea id="pluginDescription" placeholder="Example: Create a plugin that gives players a welcome message when they join, and a custom command /hello to greet them back...">I want a plugin that gives players a welcome message when they join the server.</textarea>
            </div>
            
            <div style="margin-top: 15px;">
                <label>⚡ Advanced Features (Optional)</label>
                <textarea id="advancedFeatures" placeholder="Example: Add configuration file, use PlaceholderAPI, MySQL support, etc."></textarea>
            </div>
        </div>
        
        <button onclick="generatePlugin()">🚀 Generate Plugin</button>
        
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="margin-top: 10px;">Creating your plugin... This may take 20-30 seconds</p>
        </div>
        
        <div class="output" id="output">
            <h3>✨ Generated Plugin</h3>
            <div id="pluginCode" class="code-block"></div>
            <div style="margin-top: 20px;">
                <button onclick="downloadPlugin()" style="background: #2196F3;">📥 Download as ZIP</button>
                <button onclick="copyCode()" style="background: #FF9800; margin-top: 10px;">📋 Copy Code</button>
            </div>
        </div>
        
        <div style="margin-top: 30px; text-align: center; color: #888; font-size: 14px;">
            <p>Powered by DeepSeek API via OpenRouter • Free to use • No registration required</p>
        </div>
    </div>

    <script>
        // Your OpenRouter API Key - GET THIS FROM STEP 1
        const OPENROUTER_API_KEY = "YOUR_OPENROUTER_API_KEY_HERE";
        
        async function generatePlugin() {
            const pluginDescription = document.getElementById('pluginDescription').value;
            const pluginName = document.getElementById('pluginName').value;
            const mainClass = document.getElementById('mainClass').value;
            const platform = document.getElementById('platform').value;
            const version = document.getElementById('version').value;
            const advanced = document.getElementById('advancedFeatures').value;
            
            if (!pluginDescription.trim()) {
                alert("Please describe your plugin!");
                return;
            }
            
            // Show loader
            document.getElementById('loader').style.display = 'block';
            document.getElementById('output').style.display = 'none';
            
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": "https://your-site.vercel.app",
                        "X-Title": "Minecraft Plugin AI"
                    },
                    body: JSON.stringify({
                        model: "deepseek/deepseek-chat:free",
                        messages: [
                            {
                                role: "system",
                                content: `You are an expert Minecraft plugin developer. Create complete, working plugins.

PLATFORM: ${platform.toUpperCase()}
VERSION: Minecraft ${version}
PLUGIN_NAME: ${pluginName}
MAIN_CLASS: ${mainClass}

REQUIREMENTS:
1. Generate COMPLETE plugin code
2. Include ALL files needed
3. Use proper ${platform} API for ${version}
4. Add comments and documentation
5. Include plugin.yml/sponge.json/velocity.toml as needed
6. Follow best practices for ${version}
7. Add error handling
8. Include installation instructions
9. If ${advanced} is provided, implement those features

FORMAT:
Start with "## PLUGIN STRUCTURE"
Then list files with "### filename.ext"
Then show complete code in proper format.
End with "## INSTALLATION INSTRUCTIONS"`
                            },
                            {
                                role: "user",
                                content: pluginDescription + (advanced ? "\n\nAdditional features: " + advanced : "")
                            }
                        ],
                        max_tokens: 4000,
                        temperature: 0.7
                    })
                });
                
                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    const code = data.choices[0].message.content;
                    document.getElementById('pluginCode').innerHTML = `<pre>${escapeHtml(code)}</pre>`;
                    document.getElementById('output').style.display = 'block';
                    
                    // Store code for download
                    window.currentPluginCode = code;
                } else {
                    throw new Error("No response from AI");
                }
                
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
        
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        
        function downloadPlugin() {
            if (!window.currentPluginCode) {
                alert("Generate a plugin first!");
                return;
            }
            
            // Create ZIP content
            const lines = window.currentPluginCode.split('\n');
            let currentFile = '';
            let files = {};
            let currentContent = [];
            
            for (let line of lines) {
                if (line.startsWith('### ')) {
                    if (currentFile) {
                        files[currentFile] = currentContent.join('\n');
                    }
                    currentFile = line.replace('### ', '').trim();
                    currentContent = [];
                } else if (line && !line.startsWith('## ')) {
                    currentContent.push(line);
                }
            }
            
            if (currentFile) {
                files[currentFile] = currentContent.join('\n');
            }
            
            // Create downloadable ZIP (simplified - in real app use JSZip)
            let zipContent = "=== MINECRAFT PLUGIN FILES ===\n\n";
            for (const [filename, content] of Object.entries(files)) {
                zipContent += `=== ${filename} ===\n${content}\n\n`;
            }
            
            const blob = new Blob([zipContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${document.getElementById('pluginName').value || 'plugin'}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        function copyCode() {
            if (!window.currentPluginCode) {
                alert("Generate a plugin first!");
                return;
            }
            
            navigator.clipboard.writeText(window.currentPluginCode)
                .then(() => alert("Code copied to clipboard!"))
                .catch(err => alert("Failed to copy: " + err));
        }
    </script>
</body>
</html>
